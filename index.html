<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overseas Marketing Calendar</title>
  <style>
    body{margin:0;background:#f6f7f9;color:#182033;font:14px/1.5 "Microsoft YaHei","Segoe UI",Arial,sans-serif;display:grid;min-height:100vh;place-items:center}
    main{max-width:620px;margin:24px;padding:24px;background:#fff;border:1px solid #d9dee7;border-radius:8px;box-shadow:0 14px 34px rgba(24,32,51,.08)}
    h1{margin:0 0 8px;font-size:22px}.muted{color:#667085}code{background:#f1f4f8;padding:2px 5px;border-radius:4px}
  </style>
</head>
<body>
  <main id="status"><h1>Loading calendar...</h1><p class="muted">Preparing the overseas marketing calendar.</p></main>
  <script>
    const parts = Array.from({length:9},(_,i)=>`payload/part-${String(i+1).padStart(2,'0')}.txt`);
    function decodeBase64Utf8(b64){
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }
    Promise.all(parts.map(p=>fetch(p,{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error(`${p}: ${r.status}`);
      return r.text();
    }))).then(chunks=>{
      const html = decodeBase64Utf8(chunks.join(''));
      document.open();
      document.write(html);
      document.close();
    }).catch(err=>{
      document.getElementById('status').innerHTML = `<h1>Calendar failed to load</h1><p class="muted">Missing payload file: <code>${String(err.message)}</code></p>`;
      console.error(err);
    });
  </script>
</body>
</html>
